<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AD&D 2nd Edition Spells</title>
  <style>
    :root {
      --bg: #0b0f19;
      --card-bg: #131b2e;
      --panel-bg: #0f1626;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --border: #222f4c;
      --accent: #3b82f6;
      --tag-bg: #1e293b;
      --tag-text: #93c5fd;
      --badge-priest: #34d399;
      --badge-priest-bg: #064e3b;
      --major-color: #f87171;
      --minor-color: #22c55e;
      --none-color: #64748b;
      --toggle-bg: #334155;
      --scroll-track: #0b0f19;
      --scroll-thumb: #334155;
    }

    [data-theme="light"] {
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --panel-bg: #f1f5f9;
      --text: #0f172a;
      --text-muted: #64748b;
      --border: #cbd5e1;
      --accent: #2563eb;
      --tag-bg: #e0e7ff;
      --tag-text: #3730a3;
      --badge-priest: #047857;
      --badge-priest-bg: #d1fae5;
      --major-color: #ef4444;
      --minor-color: #16a34a;
      --none-color: #94a3b8;
      --toggle-bg: #cbd5e1;
      --scroll-track: #f8fafc;
      --scroll-thumb: #cbd5e1;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      height: 100vh;
      height: 100dvh;
      width: 100vw;
      overflow: hidden;
    }

    header {
      padding: 0.6rem 1rem;
      background: var(--card-bg);
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
    }

    .header-title h1 {
      font-size: 1.05rem;
      font-weight: 700;
    }

    .dark-toggle-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.35rem 0.6rem;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.8rem;
    }

    main {
      flex: 1 1 auto;
      display: flex;
      flex-direction: column;
      padding: 0.6rem 0.75rem;
      max-width: 1280px;
      width: 100%;
      margin: 0 auto;
      min-height: 0;
    }

    /* 2-Row Toolbar Container */
    .top-toolbar {
      display: flex;
      flex-direction: column;
      gap: 0.45rem;
      margin-bottom: 0.65rem;
      flex-shrink: 0;
    }

    .toolbar-row {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      width: 100%;
    }

    .top-toolbar select,
    .top-toolbar input[type="text"],
    .top-toolbar button {
      background-color: var(--card-bg);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 0.35rem 0.45rem;
      border-radius: 6px;
      outline: none;
      font-size: 0.82rem;
      height: 34px;
      min-width: 0;
    }

    /* Row 1 specifics */
    #class-type-select {
      flex: 0 0 85px;
    }

    #search-input {
      flex: 1 1 auto;
    }

    #level-filter {
      flex: 0 0 100px;
    }

    /* Row 2 specifics */
    #school-filter {
      flex: 1 1 90px;
    }

    .sphere-toggle-btn {
      background: #0284c7 !important;
      color: #ffffff !important;
      border: none !important;
      padding: 0 0.25rem !important;
      font-size: 0.72rem !important;
      line-height: 1.1;
      font-weight: 600;
      cursor: pointer;
      flex: 1 1 auto;
      white-space: normal; /* Allows "Sphere" and "Filters" to stack cleanly if space is tight */
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .sphere-toggle-btn.active {
      background: #0369a1 !important;
      outline: 2px solid var(--accent);
    }

    .component-filters {
      display: flex;
      align-items: center;
      justify-content: space-around;
      gap: 0.35rem;
      background: var(--card-bg);
      border: 1px solid var(--border);
      padding: 0 0.45rem;
      height: 34px;
      border-radius: 6px;
      font-size: 0.78rem;
      user-select: none;
      flex: 0 0 auto;
    }

    .comp-item {
      display: flex;
      align-items: center;
      gap: 0.15rem;
      cursor: pointer;
      font-weight: 600;
    }

    .comp-item input {
      accent-color: var(--accent);
      cursor: pointer;
    }

    #sort-by {
      flex: 1 1 110px;
    }

    /* Sphere Drawer Panel */
    .sphere-panel {
      background: var(--panel-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.65rem;
      margin-bottom: 0.65rem;
      flex-shrink: 0;
      display: none;
    }

    .sphere-panel.open {
      display: block;
    }

    .panel-header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 0.4rem;
      margin-bottom: 0.5rem;
    }

    .panel-header-row span {
      font-size: 0.7rem;
      font-weight: 700;
      color: var(--text-muted);
      letter-spacing: 0.05em;
    }

    .bulk-buttons {
      display: flex;
      gap: 0.3rem;
    }

    .bulk-btn {
      border: none;
      padding: 0.25rem 0.5rem;
      border-radius: 4px;
      font-size: 0.7rem;
      font-weight: 700;
      cursor: pointer;
      color: #ffffff;
    }

    .bulk-btn.major { background: var(--major-color); }
    .bulk-btn.minor { background: var(--minor-color); }
    .bulk-btn.none { background: var(--none-color); }

    .sphere-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(105px, 1fr));
      gap: 0.5rem 0.35rem;
      max-height: 180px;
      overflow-y: auto;
      padding-right: 0.25rem;
    }

    .sphere-control-card {
      display: flex;
      flex-direction: column;
      gap: 0.2rem;
      min-width: 0;
    }

    .sphere-control-label {
      font-size: 0.72rem;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .tri-toggle {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      background: var(--toggle-bg);
      border-radius: 4px;
      padding: 1.5px;
      height: 22px;
      user-select: none;
    }

    .tri-btn {
      font-size: 0.62rem;
      font-weight: 700;
      border: none;
      background: transparent;
      color: var(--text-muted);
      border-radius: 2px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .tri-btn.active.major { background: var(--major-color); color: #ffffff; }
    .tri-btn.active.minor { background: var(--minor-color); color: #ffffff; }
    .tri-btn.active.none { background: var(--none-color); color: #ffffff; }

    /* Spell Scroll Area */
    .spell-scroll-container {
      flex: 1 1 auto;
      overflow-y: auto;
      overflow-x: hidden;
      padding-right: 0.2rem;
      display: flex;
      flex-direction: column;
      gap: 0.45rem;
      min-height: 0;
    }

    .spell-scroll-container::-webkit-scrollbar {
      width: 5px;
    }
    .spell-scroll-container::-webkit-scrollbar-track {
      background: var(--scroll-track);
    }
    .spell-scroll-container::-webkit-scrollbar-thumb {
      background: var(--scroll-thumb);
      border-radius: 3px;
    }

    details.spell-card {
      display: block;
      width: 100%;
      flex-shrink: 0;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      overflow: hidden;
    }

    details.spell-card[open] {
      border-color: var(--accent);
    }

    summary.spell-summary {
      padding: 0.55rem 0.75rem;
      list-style: none;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      user-select: none;
      gap: 0.4rem;
    }

    summary.spell-summary::-webkit-details-marker {
      display: none;
    }

    .spell-title-group {
      display: flex;
      align-items: center;
      gap: 0.45rem;
      flex: 1 1 auto;
      min-width: 0;
    }

    .spell-level {
      background: var(--tag-bg);
      color: var(--tag-text);
      font-weight: 700;
      font-size: 0.7rem;
      padding: 0.15rem 0.35rem;
      border-radius: 4px;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .spell-name {
      font-weight: 600;
      font-size: 0.88rem;
      word-break: break-word;
      overflow-wrap: break-word;
    }

    .spell-badges {
      display: flex;
      gap: 0.3rem;
      align-items: center;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .badge {
      font-size: 0.65rem;
      padding: 0.15rem 0.35rem;
      border-radius: 4px;
      border: 1px solid var(--border);
      color: var(--text-muted);
      white-space: nowrap;
    }

    .badge-sphere {
      background: var(--badge-priest-bg);
      color: var(--badge-priest);
      border: none;
      font-weight: 500;
    }

    .spell-content {
      padding: 0.75rem;
      border-top: 1px solid var(--border);
      display: block;
      overflow-wrap: break-word;
      word-break: break-word;
    }

    .spell-stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 0.4rem;
      background: var(--bg);
      padding: 0.55rem;
      border-radius: 6px;
      margin-bottom: 0.65rem;
    }

    .stat-row {
      font-size: 0.75rem;
      word-break: break-word;
    }

    .stat-row strong {
      color: var(--text-muted);
      font-size: 0.68rem;
      text-transform: uppercase;
      display: block;
      margin-bottom: 0.1rem;
    }

    .spell-description {
      font-size: 0.82rem;
      line-height: 1.5;
      white-space: pre-wrap;
      word-break: break-word;
      overflow-wrap: break-word;
    }

    .status-msg {
      margin: auto;
      color: var(--text-muted);
      text-align: center;
      padding: 1.5rem;
      font-size: 0.88rem;
    }

    @media (max-width: 600px) {
      .spell-badges {
        width: 100%;
        justify-content: flex-start;
      }
      .spell-stats-grid {
        grid-template-columns: 1fr 1fr;
      }
    }
  </style>
</head>
<body data-theme="dark">

<header>
  <div class="header-title">
    <h1>AD&D 2nd Edition Spells</h1>
  </div>
  <button class="dark-toggle-btn" id="theme-toggle">☀️ Light Mode</button>
</header>

<main>
  <div class="top-toolbar">
    <!-- Row 1: Class, Search, Level -->
    <div class="toolbar-row">
      <select id="class-type-select">
        <option value="priest" selected>Priest</option>
        <option value="wizard">Wizard</option>
      </select>

      <input type="text" id="search-input" placeholder="Search spells...">

      <select id="level-filter"></select>
    </div>

    <!-- Row 2: Schools, Sphere Filter Toggle, V S M, Sort -->
    <div class="toolbar-row">
      <select id="school-filter">
        <option value="">Schools</option>
      </select>

      <button type="button" class="sphere-toggle-btn" id="toggle-sphere-menu">
        Sphere Filters
      </button>

      <div class="component-filters">
        <label class="comp-item"><input type="checkbox" id="comp-v" checked> V</label>
        <label class="comp-item"><input type="checkbox" id="comp-s" checked> S</label>
        <label class="comp-item"><input type="checkbox" id="comp-m" checked> M</label>
      </div>

      <select id="sort-by">
        <option value="lvl-asc">Level (Low-High)</option>
        <option value="lvl-desc">Level (High-Low)</option>
        <option value="name-asc">Name (A-Z)</option>
        <option value="name-desc">Name (Z-A)</option>
      </select>
    </div>
  </div>

  <div class="sphere-panel" id="sphere-panel">
    <div class="panel-header-row">
      <span>SET EVERYTHING</span>
      <div class="bulk-buttons">
        <button type="button" class="bulk-btn major" id="bulk-major">Major</button>
        <button type="button" class="bulk-btn minor" id="bulk-minor">Minor</button>
        <button type="button" class="bulk-btn none" id="bulk-none">None</button>
      </div>
    </div>
    <div class="sphere-grid" id="sphere-grid"></div>
  </div>

  <div class="spell-scroll-container" id="spell-list">
    <div class="status-msg">Loading spells...</div>
  </div>
</main>

<script>
  const ALL_SPHERES = [
    "All", "Animal", "Astral", "Chaos", "Charm", "Combat", "Creation",
    "Divination", "Elemental Air", "Elemental Earth", "Elemental Fire",
    "Elemental Water", "Guardian", "Healing", "Law", "Necromantic",
    "Numbers", "Plant", "Protection", "Summoning", "Sun", "Thought",
    "Time", "Travelers", "War", "Wards", "Weather"
  ];

  let currentClass = 'priest';
  let wizardSpells = [];
  let priestSpells = [];
  const sphereAccess = {};

  ALL_SPHERES.forEach(s => sphereAccess[s] = 'major');

  const classSelect = document.getElementById('class-type-select');
  const searchInput = document.getElementById('search-input');
  const levelFilter = document.getElementById('level-filter');
  const schoolFilter = document.getElementById('school-filter');
  const sortBy = document.getElementById('sort-by');
  const toggleSphereBtn = document.getElementById('toggle-sphere-menu');
  const spherePanel = document.getElementById('sphere-panel');
  const sphereGrid = document.getElementById('sphere-grid');
  const spellListEl = document.getElementById('spell-list');
  const themeToggleBtn = document.getElementById('theme-toggle');

  const compV = document.getElementById('comp-v');
  const compS = document.getElementById('comp-s');
  const compM = document.getElementById('comp-m');

  const initTheme = () => {
    const saved = localStorage.getItem('theme') || 'dark';
    document.body.setAttribute('data-theme', saved);
    updateThemeBtn(saved);
  };

  const updateThemeBtn = (theme) => {
    themeToggleBtn.innerText = theme === 'dark' ? '☀️ Light Mode' : '🌙 Dark Mode';
  };

  themeToggleBtn.addEventListener('click', () => {
    const cur = document.body.getAttribute('data-theme');
    const next = cur === 'dark' ? 'light' : 'dark';
    document.body.setAttribute('data-theme', next);
    localStorage.setItem('theme', next);
    updateThemeBtn(next);
  });

  const cleanSchools = (str) => {
    if (!str) return 'Universal';
    return str.replace(/[()]/g, '').trim();
  };

  function extractSpheres(sphereStr) {
    if (!sphereStr) return [];
    const cleaned = sphereStr.replace(/Reversible|Sphere:/gi, '');
    const tokens = cleaned.split(/[,/()]/).map(s => s.trim()).filter(Boolean);
    const matched = [];

    tokens.forEach(tok => {
      const found = ALL_SPHERES.find(s => s.toLowerCase() === tok.toLowerCase());
      if (found) {
        matched.push(found);
      } else {
        ALL_SPHERES.forEach(s => {
          if (tok.toLowerCase().includes(s.toLowerCase()) && !matched.includes(s)) {
            matched.push(s);
          }
        });
      }
    });

    return matched.length ? matched : (tokens.length ? tokens : []);
  }

  function sanitizeSpell(raw) {
    const s = { ...raw };

    if (s.casting) s.casting = String(s.casting).replace(/^Casting Time:\s*/i, '').trim();
    if (s.save) s.save = String(s.save).replace(/^Saving Throw:\s*/i, '').trim();
    if (s.range) s.range = String(s.range).replace(/^(?:Reversible)?Range:\s*/i, '').replace(/Component.*$/i, '').trim();

    const hasShift = (s.components && /Duration:|Casting Time:/i.test(s.components)) ||
            (s.duration && /Area of Effect:|Saving Throw:/i.test(s.duration)) ||
            (s.aoe && /Saving Throw:|This spell/i.test(s.aoe));

    if (hasShift) {
      const blob = [
        s.components || '',
        s.duration || '',
        s.casting || '',
        s.aoe || '',
        s.save || '',
        s.description || ''
      ].join(' \n ');

      const matchComp = blob.match(/(?:Components?:\s*)([^\n\r]+?)(?=\s*(?:Duration:|Casting Time:|Area of Effect:|Saving Throw:|$))/i);
      const matchDur  = blob.match(/(?:Duration:\s*)([^\n\r]+?)(?=\s*(?:Casting Time:|Area of Effect:|Saving Throw:|Components?:|$))/i);
      const matchCast = blob.match(/(?:Casting Time:\s*)([^\n\r]+?)(?=\s*(?:Duration:|Area of Effect:|Saving Throw:|Components?:|$))/i);
      const matchAoe  = blob.match(/(?:Area of Effect:\s*)([^\n\r]+?)(?=\s*(?:Duration:|Casting Time:|Saving Throw:|Components?:|$))/i);
      const matchSave = blob.match(/(?:Saving Throw:\s*)([^\n\r]+?)(?=\s*(?:Duration:|Casting Time:|Area of Effect:|Components?:|$))/i);

      if (matchComp) s.components = matchComp[1].trim();
      if (matchDur)  s.duration = matchDur[1].trim();
      if (matchCast) s.casting = matchCast[1].trim();
      if (matchAoe)  s.aoe = matchAoe[1].trim();
      if (matchSave) s.save = matchSave[1].trim();

      const cleanField = (val, prefixRegex) => {
        if (!val) return '';
        return val.replace(prefixRegex, '').replace(/\s*(?:Casting Time|Area of Effect|Saving Throw):.*$/i, '').trim();
      };

      s.duration = cleanField(s.duration, /^(?:Duration:\s*)+/i);
      s.casting  = cleanField(s.casting, /^(?:Casting Time:\s*)+/i);
      s.aoe      = cleanField(s.aoe, /^(?:Area of Effect:\s*)+/i);
      s.save     = cleanField(s.save, /^(?:Saving Throw:\s*)+/i);
    }

    return s;
  }

  function formatBadgeComponents(compStr) {
    if (!compStr) return 'V, S';
    const matched = [];
    const upper = compStr.toUpperCase();
    if (upper.includes('V')) matched.push('V');
    if (upper.includes('S')) matched.push('S');
    if (upper.includes('M')) matched.push('M');
    return matched.length ? matched.join(', ') : 'V, S';
  }

  function formatStatComponents(compStr) {
    if (!compStr) return 'V, S';
    const upper = compStr.toUpperCase();
    const matched = [];
    if (upper.includes('V')) matched.push('V');
    if (upper.includes('S')) matched.push('S');
    if (upper.includes('M')) matched.push('M');
    return matched.length ? matched.join(', ') : compStr;
  }

  function populateLevelFilter() {
    const maxLevel = currentClass === 'priest' ? 7 : 9;
    const currentVal = levelFilter.value;

    let html = '<option value="">All (Levels)</option>';
    for (let i = 1; i <= maxLevel; i++) {
      html += `<option value="${i}">Level ${i}</option>`;
    }
    levelFilter.innerHTML = html;

    if (currentVal && parseInt(currentVal) <= maxLevel) {
      levelFilter.value = currentVal;
    } else {
      levelFilter.value = '';
    }
  }

  function populateSchools() {
    const spells = currentClass === 'wizard' ? wizardSpells : priestSpells;
    const schools = new Set();

    spells.forEach(s => {
      const clean = cleanSchools(s.schools);
      clean.split(/[,/]/).forEach(item => {
        const trimmed = item.trim();
        if (trimmed && trimmed.toLowerCase() !== 'universal') {
          schools.add(trimmed);
        }
      });
    });

    const currentSchool = schoolFilter.value;
    let options = '<option value="">Schools</option>';
    Array.from(schools).sort().forEach(s => {
      options += `<option value="${s}">${s}</option>`;
    });

    schoolFilter.innerHTML = options;
    if (schools.has(currentSchool)) {
      schoolFilter.value = currentSchool;
    } else {
      schoolFilter.value = '';
    }
  }

  function renderSphereGrid() {
    sphereGrid.innerHTML = ALL_SPHERES.map(sphere => {
      const state = sphereAccess[sphere] || 'major';
      return `
        <div class="sphere-control-card">
          <span class="sphere-control-label" title="${sphere}">${sphere}</span>
          <div class="tri-toggle" data-sphere="${sphere}">
            <button type="button" class="tri-btn major ${state === 'major' ? 'active' : ''}" data-val="major">Maj</button>
            <button type="button" class="tri-btn minor ${state === 'minor' ? 'active' : ''}" data-val="minor">Min</button>
            <button type="button" class="tri-btn none ${state === 'none' ? 'active' : ''}" data-val="none">Off</button>
          </div>
        </div>
      `;
    }).join('');

    sphereGrid.querySelectorAll('.tri-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        const parent = e.target.closest('.tri-toggle');
        const sphere = parent.dataset.sphere;
        const val = e.target.dataset.val;

        sphereAccess[sphere] = val;
        parent.querySelectorAll('.tri-btn').forEach(b => b.classList.remove('active'));
        e.target.classList.add('active');
        render();
      });
    });
  }

  document.getElementById('bulk-major').addEventListener('click', () => setAllSpheres('major'));
  document.getElementById('bulk-minor').addEventListener('click', () => setAllSpheres('minor'));
  document.getElementById('bulk-none').addEventListener('click', () => setAllSpheres('none'));

  function setAllSpheres(val) {
    ALL_SPHERES.forEach(s => sphereAccess[s] = val);
    renderSphereGrid();
    render();
  }

  async function loadData() {
    try {
      const [wRes, pRes] = await Promise.all([
        fetch('WizardSpells.json'),
        fetch('PriestSpells.json')
      ]);
      const rawWizard = await wRes.json();
      const rawPriest = await pRes.json();

      wizardSpells = rawWizard.map(sanitizeSpell);
      priestSpells = rawPriest.map(sanitizeSpell);

      populateLevelFilter();
      populateSchools();
      renderSphereGrid();
      render();
    } catch (err) {
      spellListEl.innerHTML = `<div class="status-msg">Failed to load JSON files. Serve over HTTP (e.g. npx serve or Live Server).</div>`;
    }
  }

  function getFilteredSpells() {
    const base = currentClass === 'wizard' ? wizardSpells : priestSpells;
    const search = searchInput.value.toLowerCase();
    const level = levelFilter.value;
    const school = schoolFilter.value;
    const sort = sortBy.value;

    const allowV = compV.checked;
    const allowS = compS.checked;
    const allowM = compM.checked;

    return base.filter(spell => {
      if (search && !spell.name.toLowerCase().includes(search)) return false;
      if (level && spell.lvl.toString() !== level) return false;
      if (school && !cleanSchools(spell.schools).toLowerCase().includes(school.toLowerCase())) return false;

      const c = (spell.components || '').toUpperCase();
      const hasV = c.includes('V');
      const hasS = c.includes('S');
      const hasM = c.includes('M');

      if (hasV && !allowV) return false;
      if (hasS && !allowS) return false;
      if (hasM && !allowM) return false;

      if (currentClass === 'priest') {
        const spellSpheres = extractSpheres(spell.spheres);
        if (spellSpheres.length === 0) return true;

        const hasAccess = spellSpheres.some(sp => {
          const matchedKey = ALL_SPHERES.find(k => k.toLowerCase() === sp.toLowerCase());
          const access = matchedKey ? (sphereAccess[matchedKey] || 'none') : 'major';
          if (access === 'major') return true;
          if (access === 'minor' && spell.lvl <= 3) return true;
          return false;
        });

        if (!hasAccess) return false;
      }

      return true;
    }).sort((a, b) => {
      if (sort === 'lvl-asc') return a.lvl - b.lvl || a.name.localeCompare(b.name);
      if (sort === 'lvl-desc') return b.lvl - a.lvl || a.name.localeCompare(b.name);
      if (sort === 'name-asc') return a.name.localeCompare(b.name);
      if (sort === 'name-desc') return b.name.localeCompare(a.name);
      return 0;
    });
  }

  function render() {
    const spells = getFilteredSpells();
    if (!spells.length) {
      spellListEl.innerHTML = `<div class="status-msg">No spells match the current filters.</div>`;
      return;
    }

    spellListEl.innerHTML = spells.map((spell, index) => `
      <details class="spell-card">
        <summary class="spell-summary">
          <div class="spell-title-group">
            <span class="spell-level">Lvl ${spell.lvl}</span>
            <span class="spell-name">${index + 1}. ${spell.name}</span>
          </div>
          <div class="spell-badges">
            <span class="badge">${cleanSchools(spell.schools)}</span>
            ${spell.spheres ? `<span class="badge badge-sphere">${spell.spheres.replace(/Reversible|Sphere:/gi, '').trim()}</span>` : ''}
            <span class="badge">${formatBadgeComponents(spell.components)}</span>
          </div>
        </summary>
        <div class="spell-content">
          <div class="spell-stats-grid">
            <div class="stat-row"><strong>Range</strong>${spell.range || '0'}</div>
            <div class="stat-row"><strong>Components</strong>${formatStatComponents(spell.components)}</div>
            <div class="stat-row"><strong>Duration</strong>${spell.duration || 'Instantaneous'}</div>
            <div class="stat-row"><strong>Casting Time</strong>${spell.casting || '1'}</div>
            <div class="stat-row"><strong>Area of Effect</strong>${spell.aoe || 'Special'}</div>
            <div class="stat-row"><strong>Saving Throw</strong>${spell.save || 'None'}</div>
          </div>
          <div class="spell-description">${spell.description || 'No description available.'}</div>
        </div>
      </details>
    `).join('');
  }

  classSelect.addEventListener('change', (e) => {
    currentClass = e.target.value;
    if (currentClass === 'wizard') {
      toggleSphereBtn.style.display = 'none';
      spherePanel.classList.remove('open');
      toggleSphereBtn.classList.remove('active');
    } else {
      toggleSphereBtn.style.display = 'block';
    }
    populateLevelFilter();
    populateSchools();
    render();
  });

  toggleSphereBtn.addEventListener('click', () => {
    spherePanel.classList.toggle('open');
    toggleSphereBtn.classList.toggle('active');
  });

  [searchInput, levelFilter, schoolFilter, sortBy, compV, compS, compM].forEach(el => {
    el.addEventListener('input', render);
  });

  initTheme();
  loadData();
</script>
</body>
</html>
